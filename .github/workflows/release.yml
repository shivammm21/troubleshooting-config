name: Release

# Builds the installers and attaches them to the GitHub release for the current
# app version. Triggers:
#   * push to main            -> publish/refresh the v<version> release
#   * push of a v* tag        -> same, and the tag must match the app version
#   * manual workflow_dispatch
#
# The website links to
#   .../releases/latest/download/StackPilot-Setup.exe   (Windows)
#   .../releases/latest/download/StackPilot.deb         (Linux)
# so every published release is picked up automatically without site changes.
#
# jpackage cannot cross-compile, so each bundle is built on its own OS and a
# final job publishes both to a single release.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Releases are serialised: two runs would otherwise upload to the same tag.
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Read app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version
        id: read
        shell: bash
        run: |
          set -euo pipefail

          gradle_version=$(grep -oP 'packageVersion\s*=\s*"\K[^"]+' desktop-app/build.gradle.kts | head -n1 || true)
          setup_version=$(grep -oP 'AppVersion\s*=\s*"\K[^"]+' installer/Setup.cs | head -n1 || true)

          if [ -z "$gradle_version" ] || [ -z "$setup_version" ]; then
            echo "::error::Could not read the version from desktop-app/build.gradle.kts or installer/Setup.cs"
            exit 1
          fi

          if [ "$gradle_version" != "$setup_version" ]; then
            echo "::error::Version mismatch: build.gradle.kts=$gradle_version but Setup.cs=$setup_version"
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [ "$tag_version" != "$gradle_version" ]; then
              echo "::error::Tag v$tag_version does not match app version $gradle_version. Bump packageVersion in desktop-app/build.gradle.kts and AppVersion in installer/Setup.cs, commit, then re-tag."
              exit 1
            fi
          fi

          echo "Building StackPilot $gradle_version"
          echo "version=$gradle_version" >> "$GITHUB_OUTPUT"

  build-windows-setup:
    name: Build Windows setup.exe
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build setup executable
        shell: powershell
        run: .\build-installer.ps1

      - name: Check the produced executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $versioned = Get-ChildItem 'dist\StackPilot-Setup-*.exe' | Select-Object -First 1
          if (-not $versioned) {
            throw 'No setup executable was produced.'
          }

          Write-Host ("Produced {0} ({1:N1} MB)" -f $versioned.Name, ($versioned.Length / 1MB))

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  build-linux-deb:
    name: Build Linux .deb
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install packaging tools
        # jpackage's deb bundler shells out to dpkg-deb and fakeroot.
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev

      - name: Build .deb
        run: bash ./gradlew :desktop-app:packageDeb --no-daemon --console=plain

      - name: Collect the produced package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          deb=$(find desktop-build/compose/binaries/main/deb -maxdepth 1 -name '*.deb' | head -n1)
          if [ -z "$deb" ]; then
            echo "::error::No .deb package was produced."
            exit 1
          fi

          mkdir -p dist
          # Rename to the versioned asset name; the stable name is created by
          # the publish job.
          mv "$deb" "dist/StackPilot-$VERSION.deb"
          ls -l dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish release
    needs: [version, build-windows-setup, build-linux-deb]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: dist

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dist

      - name: Create the stable asset names and checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist

          # Stable file names used by the website download links.
          cp "StackPilot-Setup-$VERSION.exe" StackPilot-Setup.exe
          cp "StackPilot-$VERSION.deb" StackPilot.deb

          sha256sum StackPilot-Setup.exe > StackPilot-Setup.exe.sha256
          sha256sum StackPilot.deb > StackPilot.deb.sha256

          ls -l

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on the default branch when it does not exist yet, so
          # a plain push to main publishes the release for the current version.
          tag_name: v${{ needs.version.outputs.version }}
          name: StackPilot v${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/StackPilot-Setup.exe
            dist/StackPilot-Setup-${{ needs.version.outputs.version }}.exe
            dist/StackPilot-Setup.exe.sha256
            dist/StackPilot.deb
            dist/StackPilot-${{ needs.version.outputs.version }}.deb
            dist/StackPilot.deb.sha256

      - name: Verify the links used by the website download buttons
        shell: bash
        run: |
          set -euo pipefail

          base='https://github.com/shivammm21/troubleshooting-config/releases/latest/download'
          for asset in StackPilot-Setup.exe StackPilot.deb; do
            ok=false
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sIL -o /dev/null -w '%{http_code}' "$base/$asset" || echo 000)
              if [ "$code" = "200" ]; then
                echo "OK (HTTP 200): $base/$asset"
                ok=true
                break
              fi
              echo "Attempt $attempt for $asset -> HTTP $code"
              sleep 10
            done
            if [ "$ok" != "true" ]; then
              echo "::error::Download link is not serving $asset: $base/$asset"
              exit 1
            fi
          done
